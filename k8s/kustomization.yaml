# Deploy (after ./k8s/create-secrets.sh, once): the committed files use the placeholder authentint.example, so the real
# address stays out of this public repo. See docs/kubernetes-deployment.md.
#   kubectl kustomize k8s | sed "s/authentint\.example/$(cat k8s/secrets/domain)/g" | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n-grp7
labels:
  - pairs:
      app.kubernetes.io/part-of: authent-int
resources:
  - config.yaml
  - postgres.yaml
  - auth-server.yaml
  - frontend.yaml
  - mock-services.yaml
  - ingress.yaml
# The frontend bakes its URLs in at build time: a new domain means rebuilding it, not just changing this tag.
images:
  - name: authent-int-auth-server
    newName: ghcr.io/ma115tte/authent-int-auth-server
    newTag: 2d66a69
  - name: authent-int-mock-services
    newName: ghcr.io/ma115tte/authent-int-mock-services
    newTag: 2d66a69
  - name: authent-int-frontend
    newName: ghcr.io/ma115tte/authent-int-frontend
    newTag: 2d66a69
