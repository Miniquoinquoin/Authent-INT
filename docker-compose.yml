# Authent'INT — stack de développement.
# Référence : docs/architecture.md §1.
#
# Un seul port publié sur l'hôte : caddy:443.
# Aucun prérequis sur la machine : les noms *.localhost résolvent nativement
# vers 127.0.0.1 dans les navigateurs (RFC 6761), sans /etc/hosts.

# Environnement commun à auth-server et à migrate (même image, même Settings).
x-auth-env: &auth-env
  ISSUER: https://auth.authentint.localhost
  PUBLIC_BASE_URL: https://app.authentint.localhost
  KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:?KEY_ENCRYPTION_KEY vide dans .env, voir .env.example}
  NUMERO_FISCAL_KEY: ${NUMERO_FISCAL_KEY:?NUMERO_FISCAL_KEY vide dans .env, voir .env.example}
  # The runtime role: plain DML, audit_events append-only (migration 3c1e7a2b9d04, ADR §8)
  DATABASE_URL: postgresql+asyncpg://authentint_app:${APP_DB_PASSWORD:-authentint-app}@postgres:5432/authentint
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true # aucune passerelle, aucun accès sortant

volumes:
  caddy_data: # CA interne + certificats, générés par Caddy
  caddy_ca: # le certificat RACINE seul (public), copié par ca-export
  pg_data: # données Postgres

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443" # le seul port publié de toute la stack
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      edge:
        aliases: # même URL pour le navigateur et pour les conteneurs
          - auth.authentint.localhost
          - app.authentint.localhost
          - impots.authentint.localhost
          - cadastre.authentint.localhost
    healthcheck:
      # Prêt quand la CA interne existe : les mocks en dépendent pour
      # faire confiance au certificat d'auth.authentint.localhost.
      test: ["CMD", "test", "-f", "/data/caddy/pki/authorities/local/root.crt"]
      interval: 2s
      timeout: 2s
      retries: 30

  # One-shot: publishes Caddy's root CERTIFICATE alone, world-readable, in caddy_ca. The mocks
  # mount that instead of caddy_data, which holds the CA's private keys (root.key, mode 0600):
  # they run non-root (uid 10001) and must neither need nor see those keys.
  ca-export:
    image: caddy:2-alpine
    command: ["install", "-m", "0644", "/data/caddy/pki/authorities/local/root.crt", "/ca/root.crt"]
    volumes:
      - caddy_data:/data:ro
      - caddy_ca:/ca
    network_mode: none
    depends_on:
      caddy:
        condition: service_healthy

  frontend:
    build: ./apps/frontend
    restart: unless-stopped
    networks: [edge]

  # One-shot : applique les migrations puis s'arrête. auth-server attend sa
  # réussite. En Kubernetes, le même rôle est tenu par un Job (§12) : un seul
  # processus migre, jamais trois réplicas en même temps.
  migrate:
    build:
      context: ./apps/auth-server
      target: runtime # same Dockerfile as auth-server: alembic is a runtime dependency
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *auth-env
      # The owner migrates (DDL, grants); it also creates authentint_app with this password
      DATABASE_URL: postgresql+asyncpg://authentint_owner:${POSTGRES_PASSWORD:-authentint}@postgres:5432/authentint
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-authentint-app}
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  # No container_name, no published port: `docker compose up --scale auth-server=3` works (ADR §15)
  auth-server:
    build:
      context: ./apps/auth-server
      target: runtime # non-root, no dev deps; docker-compose.dev.yml switches to `dev`
    restart: unless-stopped
    environment:
      <<: *auth-env
      # uvicorn only believes X-Forwarded-For from trusted proxies (default: 127.0.0.1).
      # Without this, request.client.host is Caddy's IP for EVERY user, and the
      # per-IP rate limit would put all of France in one bucket. "*" is acceptable
      # because no port is published: only containers on `edge` reach auth-server.
      # Kubernetes: replace by the Ingress controller's pod CIDR (§12).
      FORWARDED_ALLOW_IPS: "*"
    networks: [edge, data] # le seul service sur les deux réseaux
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10

  svc-impots:
    build: ./apps/mock-services # one stage target: runtime (non-root)
    restart: unless-stopped
    environment:
      SERVICE_NAME: svc-impots
      ISSUER: https://auth.authentint.localhost
      AUDIENCE: svc-impots
      CA_BUNDLE: /ca/root.crt
      CORS_ORIGIN: https://app.authentint.localhost # the portal calls us from the browser
    volumes:
      - caddy_ca:/ca:ro # pour valider le TLS de Caddy (le certificat racine seul)
    networks: [edge]
    depends_on:
      ca-export:
        condition: service_completed_successfully
    healthcheck:
      # live, not ready: the mock must stay up while auth-server boots (it retries the JWKS itself)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10

  svc-cadastre:
    build: ./apps/mock-services # même image, AUDIENCE différente
    restart: unless-stopped
    environment:
      SERVICE_NAME: svc-cadastre
      ISSUER: https://auth.authentint.localhost
      AUDIENCE: svc-cadastre
      CA_BUNDLE: /ca/root.crt
      CORS_ORIGIN: https://app.authentint.localhost # the portal calls us from the browser
    volumes:
      - caddy_ca:/ca:ro
    networks: [edge]
    depends_on:
      ca-export:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Owner of the schema, superuser of the container: used by `migrate` only.
      # Changed from authentint_app: an existing volume needs `docker compose down -v` once.
      POSTGRES_USER: authentint_owner
      POSTGRES_DB: authentint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-authentint}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [data] # invisible depuis l'hôte et depuis les mocks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentint_owner -d authentint"]
      interval: 5s
      timeout: 3s
      retries: 10
