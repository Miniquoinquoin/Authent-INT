    <meta charset="UTF-8" />

    <meta name="color-scheme" content="light dark" />
    <!-- .ico so the browser's implicit /favicon.ico request lands here too. The
         ?v= is not decoration: favicons are cached per origin, and localhost:5173
         is every Vite project's default port — without a fresh URL the browser
         keeps showing whichever icon it cached there first. Bump it if the icon
         ever changes. -->
    <link rel="icon" href="/favicon.ico?v=1" sizes="any" />

  </head>
