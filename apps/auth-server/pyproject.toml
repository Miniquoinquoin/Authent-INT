[project]
name = "auth-server"
version = "0.1.0"
description = "Authent'INT — authentication core (phase 1)"
requires-python = ">=3.13,<3.14"  # §3 pins 3.13: wheels, no source builds in the image
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "redis>=5.2",            # API-compatible with Valkey (§11b)
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "jinja2>=3.1",           # mail templates as editable HTML files, not f-strings
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "httpx>=0.28", "pip-audit>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session, as in production: the engine and the
# Valkey client are module-level and their pooled connections belong to the loop
# that opened them. A loop per test throws them away mid-suite.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# So `from helpers import ...` resolves wherever pytest was invoked from.
pythonpath = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
